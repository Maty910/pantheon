name: Bug report
description: Report a problem with Pantheon.
body:
  - type: input
    id: version
    attributes:
      label: Pantheon version
      description: Which version or commit are you using?
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Which runtime and version are you using?
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce the problem?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence (optional)
      description: Share relevant sanitized evidence if useful. Do not include private prompts, unredacted logs, or secrets.
